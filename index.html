<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <title>memory</title>
</head>

    <section class="home" id="home-screen">

            Play
            <svg class="btn__arrow" viewBox="0 0 35 15" xmlns="http://www.w3.org/2000/svg">
              <path d="M 1 6.36397 C 0.447715 6.36397 0 6.81168 0 7.36397 C 0 7.91625 0.447715 8.36397 1 8.36397 V 7.36397 V 6.36397 Z M 34.7071 8.07107 C 35.0976 7.68055 35.0976 7.04739 34.7071 6.65686 L 28.3431 0.2929 C 27.9526 -0.0976243 27.3195 -0.0976243 26.9289 0.2929 C 26.5384 0.683424 26.5384 1.31659 26.9289 1.70711 L 32.5858 7.36397 L 26.9289 13.0208 C 26.5384 13.4113 26.5384 14.0445 26.9289 14.435 C 27.3195 14.8256 27.9526 14.8256 28.3431 14.435 L 34.7071 8.07107 Z M 1 7.36397 V 8.36397 H 34 V 7.36397 V 6.36397 H 1 V 7.36397 Z" />
            </svg>
          </button>
        </div>
      </div>
    </section>

    <!--Settings-->
    <section class="settings" id="settings-screen" hidden>

      <div class="settings__layout">
        <div class="settings__main">
          <h2 class="settings__title">Settings</h2>

          <!--Themes-->
          <fieldset class="settings__group">
            <legend class="settings__legend">
              <img src="./src/assets/icons/setting_icons/palette.svg" alt="">
              Games themes
            </legend>

            <label class="settings__option">
              <input type="radio" name="theme" value="code-vibes" />
              <span class="settings__label">Code vibes theme</span>
            </label>

            <label class="settings__option">
              <input type="radio" name="theme" value="games" />
              <span class="settings__label">Gaming theme</span>
            </label>

            <label class="settings__option">
              <input type="radio" name="theme" value="da-projects" />
              <span class="settings__label">DA Projects theme</span>
            </label>
            <label class="settings__option">
              <input type="radio" name="theme" value="food" />
              <span class="settings__label">Foods theme</span>
            </label>
          </fieldset>

          <!--player colors-->
          <fieldset class="settings__group">
            <legend class="settings__legend">
              <img src="./src/assets/icons/setting_icons/chess_pawn.svg" alt="">
              Choose player
            </legend>

            <label class="settings__option">
              <input type="radio" name="player" value="blue" />
              <span class="settings__label">Blue Player</span>
            </label>

            <label class="settings__option">
              <input type="radio" name="player" value="orange" />
              <span class="settings__label">Orange Player</span>
            </label>
          </fieldset>

          <!--Cards-->
          <fieldset class="settings__group">
            <legend class="settings__legend">
              <img src="./src/assets/icons/setting_icons/style.svg" alt="">
              Board size
            </legend>

            <label class="settings__option">
              <input type="radio" name="board" value="16" />
              <span class="settings__label">16 Cards</span>
            </label>

            <label class="settings__option">
              <input type="radio" name="board" value="24" />
              <span class="settings__label">24 Cards</span>
            </label>

            <label class="settings__option">
              <input type="radio" name="board" value="36" />
              <span class="settings__label">36 Cards</span>
            </label>

          </fieldset>

        </div>
        <div class="settings__right">
          <div class="settings__preview">
            <img class="settings__preview-img" data-theme="code-vibes"
              src="./src/assets/ui/preview_imgs/code_vibes_preview.svg" alt="Code vibes theme preview" />

            <img class="settings__preview-img" data-theme="games" src="./src/assets/ui/preview_imgs/games_preview.svg"
              alt="Games theme preview" hidden />

            <img class="settings__preview-img" data-theme="da-projects"
              src="./src/assets/ui/preview_imgs/da_projects_preview.svg" alt="da-projects vibes theme preview" hidden />

            <img class="settings__preview-img" data-theme="food" src="./src/assets/ui/preview_imgs/food_preview.svg"
              alt="Foods theme preview" hidden />
          </div>

          <div class="settings__summary">
            <span id="summary-theme" class="settings__summary-item">Game theme</span>
            <span id="summary-player" class="settings__summary-item">Player</span>
            <span id="summary-board" class="settings__summary-item">Board size</span>
            <button class="settings__start" id="start-btn" disabled>
              <img src="./src/assets/icons/setting_icons/smart_display.svg" alt="">
              Start
            </button>
          </div>
        </div>
      </div>
    </section>

    <section class="gamesField" id="game-screen" hidden>
      <div class="scoreboard">
        <div class="scoreboard__scores">

          <span class="score-badge" id="score-player-1">
            <img class="score-badge__icon" id="icon-player-1" src="" alt="" />
            <span class="score-badge__player-1-group" id="score-group-player-1">
              <span id="score-color-player-1"></span>
              <span id="value-player-1">0</span>
            </span>
          </span>

          <span class="score-badge" id="score-player-2">
            <img class="score-badge__icon" id="icon-player-2" src="" alt="" />
            <span class="score-badge__player-2-group" id="score-group-player-2">
              <span id="score-color-player-2"></span>
              <span id="value-player-2">0</span>
            </span>
          </span>

        </div>

        <div class="scoreboard__current">
          <span class="curennt-player-word">Current player:</span>

          <span class="current-player-badge" id="current-player-badge">
            <img id="current-player-icon" src="" alt="" />
          </span>
        </div>

        <button class="exit-btn" id="exit-game-btn">
          <span class="exit-icon-wrapper">
            <img id="exit-btn-icon" class="exit-btn-icon" src="" alt="" />
            <img id="exit-btn-icon-hover" class="exit-btn-icon exit-btn-icon--hover" src="" alt="" />
          </span> Exit game
        </button>
      </div>

      <div class="board" id="board"></div>
    </section>




    <section class="gameover-screen" id="gameover-screen" hidden>
      <div class="gameover-screen__content">
        <h1>Game over</h1>
        <img class="gameover-screen__title-img" src="/src/assets/icons/code-vibes/gameOver.svg" alt="Game over" />
        <p>Final score</p>
        <div class="gameover-screen__scores">
          <span class="score-badge" id="gameover-score-player-1">
            <img id="gameover-icon-player-1" src="" alt="" />
            <span id="gameover-color-player-1"></span>
            <span id="gameover-value-player-1">0</span>
          </span>

          <span class="score-badge" id="gameover-score-player-2">
            <img id="gameover-icon-player-2" src="" alt="" />
            <span id="gameover-color-player-2"></span>
            <span id="gameover-value-player-2">0</span>
          </span>
        </div>
      </div>
    </section>





    <section class="winner-screen" id="winner-screen" hidden>
      <img class="confetti" src="./src/assets/background/confetti.svg" alt="">
      <div class="winner-screen__content">
        <p class="winner-screen__label">The winner is</p>
        <h1 id="winner-name">Player</h1>
        <span class="winner-icon-wrapper">
          <img id="winner-icon" src="" alt="" />
        </span>
        <button class="home-btn" id="winner-home-btn">Home</button>
      </div>
    </section>

    <section class="draw-screen" id="draw-screen" hidden>
      <div class="draw-screen__content">
        <p class="draw-screen__label">It's a</p>
        <h1 class="draw-screen__title-text">DRAW</h1>
        <img class="draw-screen__title-img" src="" alt="DRAW" id="draw-title-img" />
        <img class="draw-screen__scale-icon" src="" alt="" id="draw-icon" />
        <button class="home-btn" id="draw-home-btn">Home</button>
      </div>
    </section>



    <dialog id="exit-confirm-dialog" class="exit-dialog">
      <p class="exit-dialog__text">Are you sure you want to quit the game?</p>
      <div class="exit-dialog__actions">
        <button class="cancel-btn" id="cancel-exit-btn">Back to game</button>
        <button class="confirm-exit-btn" id="confirm-exit-btn">Exit game</button>
      </div>
    </dialog>


  </main>



  <script type="module" src="/src/main.ts"></script>
</body>

</html> <!---->
